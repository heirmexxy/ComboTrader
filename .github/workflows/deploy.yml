# Tests every push. The server also updates itself every 2 minutes (deploy/auto-update-on.sh). On main, this also deploys to the Hostinger VPS once these repository secrets exist:
#   VPS_HOST (server IP), VPS_SSH_KEY (private key whose public half is in /home/combotrader/.ssh/authorized_keys)
name: Test and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency: deploy-production
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_SSH_KEY" ]; then echo "VPS_HOST / VPS_SSH_KEY not set yet — skipping deploy."; exit 0; fi
          mkdir -p ~/.ssh
          # Strip Windows line endings and stray spaces that creep in when the key is copied from a browser terminal.
          # Accepts the key as copied (multi-line) or as one base64 line from: base64 -w0 /home/combotrader/.ssh/github_actions
          if printf '%s' "$VPS_SSH_KEY" | grep -q 'BEGIN OPENSSH'; then
            printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' > ~/.ssh/id_ed25519
          else
            printf '%s' "$VPS_SSH_KEY" | tr -d '\r\n\t ' | base64 -d > ~/.ssh/id_ed25519 2>/dev/null || true
          fi
          chmod 600 ~/.ssh/id_ed25519
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            echo "::warning::VPS_SSH_KEY is not a readable private key, so this push was not deployed over SSH. If the server's automatic updates are on (deploy/auto-update-on.sh), it will pick up this version within 2 minutes."; exit 0
          fi
          echo "Key fingerprint: $(ssh-keygen -lf ~/.ssh/id_ed25519 | awk '{print $2}')"
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 combotrader@"$VPS_HOST" '/srv/combotrader/deploy/update.sh' || { echo "::warning::SSH deploy did not complete; the server's automatic updates will retry within 2 minutes."; exit 0; }
