# Tests every push. On main, deploys to the Hostinger VPS once these repository secrets exist:
#   VPS_HOST (server IP), VPS_SSH_KEY (private key whose public half is in /home/combotrader/.ssh/authorized_keys)
name: Test and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency: deploy-production
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_SSH_KEY" ]; then echo "VPS_HOST / VPS_SSH_KEY not set yet — skipping deploy."; exit 0; fi
          mkdir -p ~/.ssh && printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_ed25519 combotrader@"$VPS_HOST" '/srv/combotrader/deploy/update.sh'
